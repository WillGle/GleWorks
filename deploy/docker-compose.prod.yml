# Production topology for the static portfolio on a public VPS.
#
#   internet --443--> caddy (auto-TLS) --> frontend (nginx: static SPA)
#
# Run from the repo root:
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
services:
  frontend:
    build: ..
    image: ${FRONTEND_IMAGE:-glework-frontend:${TAG:-latest}}
    expose:
      - "80"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
